                  - row "Subject Subjects are standardized terms to describe record topics in FRASER. They can be of the type topic, geographic, name or titleInfo. However, note that no subject record is a name record -- instead, authors are assigned as name subjects. Note that when requesting subject metadata, the key corresponding to the name of the subject will be the type of subject (that is, either topic, geographic or titleInfo)." [ref=e159]:
