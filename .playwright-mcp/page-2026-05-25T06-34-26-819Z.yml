            - generic [ref=e102]:
              - text: FRASER REST API
              - generic [ref=e103]: 1.0.0
            - generic [ref=e105]:
              - heading "Overview" [level=1] [ref=e106]
              - paragraph [ref=e107]:
                - text: The FRASER REST API enables users to view or reuse data. If you are interested in contributing content to FRASER, refer to our
                - link "Collection Development Policy" [ref=e108] [cursor=pointer]:
                  - /url: https://fraser.stlouisfed.org/files/docs/FRASER-collection-development.pdf
                - text: or
                - link "contact us" [ref=e109] [cursor=pointer]:
                  - /url: https://fraser.stlouisfed.org/contact
                - text: . An API client is recommended for making requests. Command line environments are not currently supported.
              - heading "Requests" [level=1] [ref=e110]
              - heading "API Key" [level=2] [ref=e111]
              - paragraph [ref=e112]: In order to access the FRASER API, you'll need an API key. To request a FRASER API key, submit a POST request with your email in the body.
              - code [ref=e114]: "curl --data '{\"email\": \"myemailaddress@test.com\", \"description\": \"my api key\"}' https://fraser.stlouisfed.org/api/api_key"
              - paragraph [ref=e115]: To make requests to the FRASER API, you'll need to include the API key as a request header. For example
              - code [ref=e117]: "curl --header '{\"X-API-Key\": \"abcdefghijklmnopqrstuvwxyz123456\"}' https://fraser.stlouisfed.org/api/title"
              - heading "Rate Limits" [level=2] [ref=e118]
              - paragraph [ref=e119]: Each API key is limited to 30 requests per minute. The FRASER API automatically enforces the throttle limit.
              - heading "FRASER Data Model" [level=2] [ref=e120]
              - table [ref=e121]:
                - rowgroup [ref=e122]:
                  - row "record type description" [ref=e123]:
                    - columnheader "record type" [ref=e124]
                    - columnheader "description" [ref=e125]
                - rowgroup [ref=e126]:
                  - row "Title Titles are the top-level FRASER record type. They can be standalone records that contain a single relationship to a file (or files) (such as a PDF or MP3) or they can contain multiple children, called items. Sometimes, however, titles have more complex relationships to other FRASER records. Archival collections are titles that can have nested relationships to both other titles and individual items. Similarly, series are aggregated collections of other titles. Both of these categories are subsumed under the title type." [ref=e127]:
                    - cell "Title" [ref=e128]
                    - cell "Titles are the top-level FRASER record type. They can be standalone records that contain a single relationship to a file (or files) (such as a PDF or MP3) or they can contain multiple children, called items. Sometimes, however, titles have more complex relationships to other FRASER records. Archival collections are titles that can have nested relationships to both other titles and individual items. Similarly, series are aggregated collections of other titles. Both of these categories are subsumed under the title type." [ref=e129]:
