                  - row "Timeline Timelines are FRASER records that track events for a particular topic over time. Events are the component pieces of the timeline. Events occasionally reference other FRASER records, but these references are not reciprocal -- the referenced FRASER record does not reference back to the timeline. Note that timeline IDs are different from the other identifiers in that they are strings, as opposed to integers." [ref=e176]:
