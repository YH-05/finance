# quants - Docker Compose 開発環境設定
# 使い方: docker compose run --rm dev claude

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quants-dev
    stdin_open: true  # インタラクティブ入力（-i）
    tty: true         # ターミナル割り当て（-t）
    volumes:
      # プロジェクトソース（リアルタイム編集可能）
      - .:/app

      # Claude Code 設定・履歴の永続化
      - claude-config:/root/.claude

      # Git 設定の共有（ホストから読み取り専用）
      - ~/.gitconfig:/root/.gitconfig:ro

      # SSH 鍵の共有（GitHub push/pull 用）
      - ~/.ssh:/root/.ssh:ro

      # GitHub CLI 認証の共有
      - ~/.config/gh:/root/.config/gh

      # Python .venv をコンテナ内に隔離（パフォーマンス向上）
      - venv:/app/.venv

    environment:
      # API キー（.env ファイルから読み込み）
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - FRED_API_KEY=${FRED_API_KEY:-}
      - GH_TOKEN=${GH_TOKEN:-}
      # アプリケーション設定
      - LOG_LEVEL=INFO
      - PROJECT_ENV=development
      - TERM=xterm-256color

    working_dir: /app

  # Neo4j Enterprise - 全プロジェクト共有インスタンス
  # データベース: note, research, creator, quants
  neo4j:
    image: neo4j:5.26-enterprise
    container_name: neo4j-enterprise
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt protocol
    volumes:
      # bind mount はローカルディスクの ~/neo4j-data/ を使用 (外付け SSD は使わない)
      # YAML では ~ が展開されないため ${HOME} を使う (複数 PC のユーザー名差を吸収)
      - ${HOME}/neo4j-data/enterprise/data:/data
      - ${HOME}/neo4j-data/enterprise/logs:/logs
      - ${HOME}/neo4j-data/enterprise/plugins:/plugins
      - ${HOME}/neo4j-data/enterprise/import:/var/lib/neo4j/import
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-gomasuke}
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      # 複数データベース有効化
      - NEO4J_initial_dbms_default__database=neo4j
      - NEO4J_dbms_max__databases=10
      # プラグイン
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      # メモリ設定（4DB統合: Community 3台分 + quants）
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=2g
      - NEO4J_server_memory_pagecache_size=1g
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  claude-config:  # Claude Code 設定の永続化
  venv:           # Python 仮想環境の隔離
