# ============================================================
# 解決アルゴリズム
# ============================================================
resolution:
  algorithm: |
    入力: promoter_names_full_list (string, '|' 区切り)
    出力: classification = 'OWNER' | 'PROFESSIONAL' | 'STATE' | 'MNC' | 'UNKNOWN'

    1. 各 keyword リストを順に走査:
       - state_keywords (最強)
       - mnc_keywords
       - professional_keywords
       - owner_keywords
    2. 各 keyword について promoter_names_full_list に
       case-insensitive な substring match があれば、
       そのカテゴリを記録（matched_categories: list）
    3. matched_categories の優先順位:
       - state ∈ matched → STATE （ただし Owner 一族と共存する場合は Owner 優先 = Tata Communications 例外）
       - 唯一 owner ∈ matched → OWNER
       - 唯一 professional ∈ matched → PROFESSIONAL
       - mnc ∈ matched → MNC
       - 矛盾 (owner + professional 等) → UNKNOWN（AI レビューへ）
       - すべて未マッチ → UNKNOWN（AI レビューへ）

  conflict_resolution:
    # Tata Communications は GOI + Tata Sons の二重 promoter で rev1=Professional
    - rule: "if 'Tata Sons' in promoters AND 'PRESIDENT OF INDIA' in promoters → PROFESSIONAL"
      sample_stocks: ["TATACOMM"]
    # 「Tata」と「Mahindra」が同時に matched なケース → Mahindra 優先（Mahindra 系列の方が一族色が強い）
    - rule: "owner family match strength > professional parent match strength"
      note: "ただし Tata Sons / HDFC / ICICI のような大手機関 promoter が明示的に存在する場合は PROFESSIONAL"

# ============================================================
# メンテナンス
# ============================================================
maintenance:
  expected_coverage:
    director_only_in_rev1: 64  # rev1 GT × director_only intersection
    fp_to_eliminate: 42        # Professional/State/MNC で誤って OWNER 判定された
    tp_to_preserve: 22         # 真 Owner で持株会社経由の dir+kmp 極小ケース
  review_cadence: "rev1 更新時 / 新規 corporate action 検出時"
  validation:
    # このリストで FP/FN を再評価し、想定と異なるケースを記録
    benchmark_csv: "notebook/NSE/data/exports/nse/owners_rev1_false_positives.csv"
    target_metrics:
      precision: ">= 95%"
      recall: ">= 97%"
      f1: ">= 96%"
