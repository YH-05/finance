# NSE Promoter Classifier — 既知一族リスト
#
# 目的:
#   `owner_confirmed_director_only` ラベルが付与された銘柄に対して、
#   promoter_names_full_list を本リストと照合し、
#   - Owner family match → OWNER 確定
#   - Professional/State/MNC parent match → NOT_OWNER 確定
#   - 未マッチ → OWNER_WEAK 降格 + ai_review_needed=True
#
# データソース:
#   rev1 ground truth × director_only intersection 64 銘柄から逆引き
#   (Professional 29 / Owner 22 / State 8 / MNC 5)
#
# 整備方針:
#   - keyword は promoter_names_full_list に含まれる substring でマッチ判定（case-insensitive）
#   - 1 keyword で 1 か複数の銘柄を救済できる粒度を選ぶ
#   - 過剰マッチ（誤分類）を避けるため、固有名詞性が高い名称を選ぶ
#   - rev1 は ISIN ベース canonical (632 件)。新規 corporate action 発生時はリスト追補
#
# 関連:
#   - act-2026-04-30-003 (本ファイル構築)
#   - act-2026-04-30-004 (本リストを Tier 2 にハイブリッド統合)
#   - 議論メモ: docs/plan/2026-04-30_discussion-nse-owners-rev1-evaluation.md
#
# バージョン: 0.1.0 (seed)
# 更新日: 2026-04-30

version: "0.5.1"
updated_at: "2026-05-11"
changelog:
  v0.5.1:
    - "act-2026-05-11-018: 残 OWNER_WEAK 3 件 (NETWORK18/JPPOWER/ESCORTS) 解消"
    - "schema 拡張: owner_keywords エントリに exclude_when_also_matches: [keyword,...] を追加可能化 (信託 vehicle 経由保有のような OWNER+PROFESSIONAL 両マッチ問題への対処)"
    - "RELIANCE INDUSTRIES LIMITED に exclude_when_also_matches: ['Independent Media Trust'] 追加 (NETWORK18: Reliance 信託経由保有 → Professional 確定)"
    - "owner_keywords: JPPOWER 用 'JAIPRAKASH ASSOCIATES' / 'JAYPEE INFRA VENTURES' 追加 (family: Gaur (Jaypee))"
    - "owner_keywords: ESCORTS 用 'NIKHIL NANDA' / 'HAR PARSHAD AND COMPANY' / 'NIKY TASHA' 追加 (family: Nanda)"
    - "Kubota Corporation, Japan は MNC 扱いせず rev1=Owner を尊重 (Nanda 一族が CMD として支配継続)"
  v0.5.0:
    - "act-2026-05-07-001 + act-2026-05-07-004: rev1 圏外 P0 10 件の web 裏取り判定を反映"
    - "owner_keywords: WAAREERTL/AXISCADES/REFEX/STYRENIX 用 4 keyword 追加"
    - "professional_keywords: HCG (KKR 取得済)/THYROCARE/FEDFINA/ITCHOTELS/JSFB 用 7 keyword 追加"
    - "mnc_keywords: GVT&D 用 3 keyword 追加 (GE Vernova/Alstom Grid)"
    - "重要訂正: 当初 v0.5.0 提案で HCG=Owner (AJAIKUMAR) としたが、2025/02 KKR controlling 54% 取得により Professional 訂正"
    - "重要訂正: STYRENIX は当初保留だったが Shiva Performance Materials 独立 buyout で Owner 確定"
  v0.4.0:
    - "act-2026-05-07-002: B カテゴリ 4 銘柄の救済"
    - "mnc_keywords: SANOFI のため 'Sanofi'/'sanofi' 追加"
    - "professional_keywords: UTKARSHBNK のため 'Utkarsh Coreinvest' 追加"
    - "state_keywords: GUJGASLTD のため Gujarat State Petroleum/Petronet 系 4 keyword 追加"
  v0.3.0:
    - "AWL (Kuok/Wilmar) と GLAND (Guo/Fosun) を owner_keywords に追加 (act-005)"
    - "誤マッチ回避のため AWL は 'Lence Pte'、GLAND は 'Fosun' で限定 (Wilmar/Kuok keyword は副作用大)"
  v0.2.0:
    - "Tier 1.5 corporate-vehicle rescue 用 keyword 追加 (act-2026-04-30-A2)"
    - "AEGISLOG (Malhotra), ROUTE (Gupta) family 追加"
    - "RIL keyword を 'RELIANCE INDUSTRIES LIMITED' に置換 (DRILLING/TRIL 過剰マッチ防止)"
    - "SPANDANA を Kedaara sample_stocks に追記"
  v0.1.0:
    - "rev1 GT × director_only 64 銘柄からの seed 抽出"

